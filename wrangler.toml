name = "game-night"
main = "src/worker/index.ts"
compatibility_date = "2024-11-11"
# The site itself lives on Cloudflare Pages. This Worker only hosts the room Durable Object,
# so it gets no public workers.dev address.
workers_dev = false
preview_urls = false

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "LIBRARY"
class_name = "Library"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Library"]

[observability]
enabled = true
